name: tugon_app
description: A barangay help mobile app for community services, reports, and announcements.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0

  # Core Firebase
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  google_sign_in: ^6.1.4
  http: ^1.1.0

  # State Management
  provider: ^6.1.1

  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9

  # Utilities
  intl: ^0.18.1
  shared_preferences: ^2.2.2

  # Phone & SMS
  country_code_picker: ^3.0.0
  pinput: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logo/
    - assets/logo/TUGON_logo.png
    - assets/logo/TUGON_Logo-lowercase-v2.png
    - assets/logo/TUGON_Logo-uppercase.png
    - asses/logo/TUGON_Logo-white.png